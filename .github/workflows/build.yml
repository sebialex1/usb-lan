name: Build and prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = v0.2.<run number>)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag != '' && inputs.tag || format('v0.2.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PversionNameOverride="${TAG#v}"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/usb-lan-${TAG}.apk"

      - name: Create prerelease
        run: |
          gh release create "${TAG}" "dist/usb-lan-${TAG}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "USB LAN ${TAG}" \
            --prerelease \
            --notes "Experimental build. Signed release APK built from ${GITHUB_SHA}. Updates install over previous SIGNED versions (v0.2.0 and later); if you have a debug v0.1.x build installed, uninstall it first (different signing key). Creates an IPv4 LAN (10.7.0.1 / 10.7.0.2) between two Android phones over a USB-C cable using Android Open Accessory and a VpnService TUN. Build-verified only; not tested on hardware. Install the same APK on both phones."
