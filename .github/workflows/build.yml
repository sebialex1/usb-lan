name: Build and prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/usb-lan-${TAG}.apk"

      - name: Create prerelease
        run: |
          gh release create "${TAG}" "dist/usb-lan-${TAG}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "USB LAN ${TAG}" \
            --prerelease \
            --notes "Experimental build. Debug-signed APK built from ${GITHUB_SHA}. Creates an IPv4 LAN (10.7.0.1 / 10.7.0.2) between two Android phones over a USB-C cable using Android Open Accessory and a VpnService TUN. Build-verified only; not tested on hardware. Install the same APK on both phones."
